name: Deploy Ground Delta to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'ground-delta/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GROUND_DELTA_JOURNAL }}'
          projectId: ground-delta-journal
          channelId: live
          entryPoint: ground-delta
